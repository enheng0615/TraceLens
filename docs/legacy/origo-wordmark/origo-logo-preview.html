<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORIGO Logo</title><style>
*{box-sizing:border-box}body{margin:0;background:#efefec;color:#0b0d12;font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 40px));margin:48px auto 80px}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:30px}.k{font:700 11px ui-monospace,monospace;letter-spacing:.18em}.head h1{font-size:clamp(54px,9vw,100px);line-height:.9;letter-spacing:.06em;margin:14px 0 8px}.head p{max-width:440px;color:#61636a;line-height:1.6}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.card{border-radius:32px;background:#fff;padding:40px}.hero{min-height:600px;display:grid;place-items:center}.hero img{width:min(470px,84%)}.side{display:grid;gap:20px}.dark{background:#0b0d12;min-height:290px;display:grid;align-content:center}.dark img{width:100%}.sizes{min-height:290px}.sizes h2,.dark h2{font-size:13px;letter-spacing:.08em;margin:0 0 32px}.dark h2{color:#fff}.row{display:flex;gap:30px;align-items:end}.sample{display:grid;gap:9px;color:#6c6d72;font:11px ui-monospace,monospace}.lock{margin-top:20px}.lock img{width:min(700px,100%)}.meaning{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#d5d5d0;border-radius:30px;overflow:hidden}.meaning div{background:#fff;padding:32px}.meaning strong{display:block;margin-bottom:9px}.meaning p{margin:0;color:#62636a;line-height:1.55}@media(max-width:760px){.head{display:block}.grid,.meaning{grid-template-columns:1fr}.hero{min-height:400px}.wrap{width:min(100% - 24px,1200px)}.card{padding:28px}}</style></head><body><main class="wrap"><header class="head"><div><div class="k">ORIGO / FINAL MARK</div><h1>ORIGO</h1><b>From outcome to origin.</b></div><p>完整标准圆与精确中心点。去掉不规则曲线、功能图示和所有强调色，让品牌回到最基本的几何秩序。</p></header><section class="grid"><div class="card hero"><img src="../src/web/public/assets/logo-mark.svg" alt="ORIGO 圆环与源点标志"></div><div class="side"><div class="card dark"><h2>REVERSED WORDMARK</h2><img src="../src/web/public/assets/logo-horizontal-dark.svg" alt="ORIGO 反白字标"></div><div class="card sizes"><h2>SMALL-SIZE TEST</h2><div class="row"><span class="sample"><img src="../src/web/public/assets/logo-mark.svg" width="96" alt="">96 px</span><span class="sample"><img src="../src/web/public/assets/logo-mark.svg" width="48" alt="">48 px</span><span class="sample"><img src="../src/web/public/assets/favicon.svg" width="24" alt="">24 px</span><span class="sample"><img src="../src/web/public/assets/favicon.svg" width="16" alt="">16 px</span></div></div></div></section><section class="card lock"><img src="../src/web/public/assets/logo-horizontal.svg" alt="ORIGO 标准字标"></section><section class="meaning"><div><strong>O</strong><p>严格标准圆，不使用手绘贝塞尔曲线。</p></div><div><strong>Origin</strong><p>唯一中心点，表达可验证的问题源头。</p></div><div><strong>Monochrome</strong><p>只使用黑白，不依赖流行色或装饰效果。</p></div></section></main></body></html>
