<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORIGO Brand Mark</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeee9;color:#10131a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 40px));margin:48px auto 80px}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:30px}.k{color:#665cff;font:700 11px ui-monospace,monospace;letter-spacing:.18em}.head h1{font-size:clamp(52px,9vw,100px);line-height:.9;letter-spacing:.08em;margin:14px 0 8px}.head p{max-width:460px;color:#6b6d76;line-height:1.6}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.card{border-radius:32px;background:#fff;padding:40px}.hero{min-height:600px;display:grid;place-items:center}.hero img{width:min(500px,86%)}.side{display:grid;gap:20px}.dark{background:#10131a;min-height:290px;display:grid;align-content:center}.dark img{width:100%}.sizes{min-height:290px}.sizes h2,.dark h2{font-size:14px;margin:0 0 32px}.dark h2{color:#f7f7f4}.row{display:flex;gap:28px;align-items:end}.sample{display:grid;gap:9px;color:#777;font:11px ui-monospace,monospace}.lock{margin-top:20px}.lock img{width:min(620px,100%)}.meaning{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#d4d4cf;border-radius:30px;overflow:hidden}.meaning div{background:#fff;padding:32px}.meaning strong{display:block;margin-bottom:9px}.meaning p{margin:0;color:#6b6d76;line-height:1.55}@media(max-width:760px){.head{display:block}.grid,.meaning{grid-template-columns:1fr}.hero{min-height:400px}.wrap{width:min(100% - 24px,1200px)}.card{padding:28px}}</style></head><body><main class="wrap"><header class="head"><div><div class="k">ORIGO / BRAND SYSTEM</div><h1>ORIGO</h1><b>From outcome to origin.</b></div><p>一条连续 Trace 从结果向内回溯，在唯一的 Origin 点结束。符号同时形成品牌首字母 O。</p></header><section class="grid"><div class="card hero"><img src="../src/web/public/assets/logo-mark.svg" alt="ORIGO 回溯轨道主标志"></div><div class="side"><div class="card dark"><h2>DARK LOCKUP</h2><img src="../src/web/public/assets/logo-horizontal-dark.svg" alt="ORIGO 深色横版"></div><div class="card sizes"><h2>SMALL-SIZE TEST</h2><div class="row"><span class="sample"><img src="../src/web/public/assets/logo-mark.svg" width="96" alt="">96 px</span><span class="sample"><img src="../src/web/public/assets/logo-mark.svg" width="48" alt="">48 px</span><span class="sample"><img src="../src/web/public/assets/favicon.svg" width="24" alt="">24 px</span><span class="sample"><img src="../src/web/public/assets/favicon.svg" width="16" alt="">16 px</span></div></div></div></section><section class="card lock"><img src="../src/web/public/assets/logo-horizontal.svg" alt="ORIGO 横版 Logo"></section><section class="meaning"><div><strong>Orbit</strong><p>完整执行轨迹，而非抽象装饰圆环。</p></div><div><strong>Origin</strong><p>紫色源点代表经证据确认的最初原因。</p></div><div><strong>O</strong><p>轨迹构成品牌首字母，建立名称与符号的直接记忆。</p></div></section></main></body></html>
